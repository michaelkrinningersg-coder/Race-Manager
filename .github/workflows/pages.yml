name: Deploy to GitHub Pages

on:
  push:
    # Nur main. Ein Versuch, zusaetzlich vom Entwicklungsbranch zu deployen,
    # scheiterte an der Umgebung `github-pages`: Sie laesst Deployments nur vom
    # Default-Branch zu, und der deploy-Job wird abgewiesen, bevor sein erster
    # Schritt laeuft. Der build-Job dagegen laeuft auf jedem Branch durch - die
    # Schranke sitzt am Deployment, nicht am Bau.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      # Die Seite zeigt kein erfundenes Beispiel mehr, sondern das Erzeugnis der
      # Engine. Es entsteht hier statt im Repo: `data/*.csv` sind die Wahrheit,
      # die Datenbank ist Erzeugnis und hat unter Versionskontrolle nichts
      # verloren. Kostet rund eine halbe Minute und laesst jede Aenderung an den
      # Stammdaten oder am Balancing automatisch auf die Seite durchschlagen.
      - name: Welt erzeugen (Bootstrap, 20 Saisons, Auslieferdatei)
        run: npm run world

      - name: Typen pruefen und bauen
        run: npm run build

      # Voraussetzung (einmalig): Settings -> Pages -> Source = "GitHub Actions".
      # Das Aktivieren per Workflow ist nicht moeglich, der Actions-Token darf
      # die Pages-API nicht schreiben.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
